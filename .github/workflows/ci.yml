name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. The publish workflow is the only one that needs more,
# and it asks for it there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the current LTS. A package that
        # only builds on the newest Node is a package most consumers cannot use.
        node: ['22.18', '24']
    steps:
      # Every action is pinned to a commit SHA, not a tag: a tag is mutable and
      # a published package's build is a supply-chain surface.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test, isolation
        run: pnpm run ci

  consumer-smoke:
    # Everything above runs TypeScript SOURCE on a modern Node. This is the only
    # job that loads the BUILT package, and it runs on the floor the published
    # manifests declare — so `engines.node` stops being a claim nothing measured.
    name: consumer smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor each package declares. The smoke test asserts this matches
        # `engines.node`, so raising one without the other fails loudly here
        # rather than shipping an untested compatibility claim.
        node: ['18']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Build on the toolchain's Node: the workspace needs >=22.18 to install and
      # compile at all, which is exactly why the floor could never be part of the
      # matrix above.
      - name: Set up Node (toolchain)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Node (published floor)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Load the built package on the declared floor
        run: node scripts/smoke-consumer.mjs

  publishable:
    # `pnpm publish --recursive` SKIPS a package whose version is already on the
    # registry, so a package whose content changed without a version bump is
    # silently left out of the release — which is how #36 shipped a `core` that
    # its own consumers could not import.
    #
    # Its own job rather than a step in `pnpm run ci`, for two reasons. It is the
    # only check here that needs the network, so a registry blip must not be able
    # to mask the build, the tests or the isolation guard; and `pnpm run ci` is
    # what a developer runs locally, where staying offline is worth keeping.
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # The guard compares PACKED content against PUBLISHED content, so `dist`
      # has to exist — a pack over an unbuilt tree would report every package as
      # differing from its published tarball.
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Compare what would be published against what already is
        run: pnpm run check:publishable
