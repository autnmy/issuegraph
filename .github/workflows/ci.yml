name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. The publish workflow is the only one that needs more,
# and it asks for it there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the current LTS. A package that
        # only builds on the newest Node is a package most consumers cannot use.
        node: ['22.18', '24']
    steps:
      # Every action is pinned to a commit SHA, not a tag: a tag is mutable and
      # a published package's build is a supply-chain surface.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test, isolation
        run: pnpm run ci

  consumer-smoke:
    # Everything above runs TypeScript SOURCE on a modern Node. This is the only
    # job that loads the BUILT package, and it runs on the floor the published
    # manifests declare — so `engines.node` stops being a claim nothing measured.
    name: consumer smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor each package declares. The smoke test asserts this matches
        # `engines.node`, so raising one without the other fails loudly here
        # rather than shipping an untested compatibility claim.
        node: ['18']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Build on the toolchain's Node: the workspace needs >=22.18 to install and
      # compile at all, which is exactly why the floor could never be part of the
      # matrix above.
      - name: Set up Node (toolchain)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Node (published floor)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Load the built package on the declared floor
        run: node scripts/smoke-consumer.mjs

      # `pnpm check:publishable` is deliberately NOT a job here, and the reason is
      # this repository's own release discipline: CHANGELOG.md states that "while
      # the spec is a pre-1.0 draft, drafting churn lives in git history, not in
      # version bumps — the version moves when there is a consumer-visible reason
      # for it to move."
      #
      # That guard asks whether a package's content has drifted from its
      # published version, so between releases it is EXPECTED to be true: as a
      # per-PR gate it would red every pull request that edits package source
      # until somebody bumped a version, which is precisely the churn the policy
      # exists to avoid. A gate that fires on the healthy case is a gate somebody
      # switches off.
      #
      # It runs where the decision is actually made instead — `publish.yml`,
      # immediately before the irreversible step, and on dry runs too, so a
      # release can be rehearsed to find out what needs bumping. Its DECISION
      # LOGIC is still covered on every PR: `scripts/check-publishable.test.ts`
      # is collected by `pnpm test`, which the `check` job above runs.
