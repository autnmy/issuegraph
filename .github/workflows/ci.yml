name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. The publish workflow is the only one that needs more,
# and it asks for it there.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the current LTS. A package that
        # only builds on the newest Node is a package most consumers cannot use.
        node: ['22.18', '24']
    steps:
      # Every action is pinned to a commit SHA, not a tag: a tag is mutable and
      # a published package's build is a supply-chain surface.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build, test, isolation
        run: pnpm run ci
